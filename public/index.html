<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bozor</title>
  <style>
    :root { --main: #1f6feb; --bg: #f5f6f8; --card: #fff; --text: #222; --muted: #777; --danger: #d33; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--card); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; box-shadow: 0 1px 3px #0001; position: sticky; top: 0; }
    .logo { font-weight: 700; font-size: 20px; color: var(--main); text-decoration: none; }
    nav a { margin-left: 12px; color: var(--text); text-decoration: none; font-size: 14px; }
    main { max-width: 960px; margin: 16px auto; padding: 0 12px; }
    h2 { margin-top: 0; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    input, select, textarea, button { font: inherit; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    input, select, textarea { background: #fff; }
    textarea { width: 100%; min-height: 100px; }
    button { background: var(--main); color: #fff; border: none; cursor: pointer; }
    button.danger { background: var(--danger); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .card, .row, .detail, .form { background: var(--card); border-radius: 10px; padding: 14px; text-decoration: none; color: inherit; display: block; }
    .card h3 { margin: 0 0 6px; font-size: 16px; }
    .card b.price, .price { color: var(--main); font-size: 18px; }
    .card small, .row small { color: var(--muted); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .form { display: flex; flex-direction: column; gap: 10px; max-width: 480px; }
    .phone { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; background: #eef4ff; border-radius: 6px; color: var(--main); text-decoration: none; }
    .desc { white-space: pre-wrap; }
    .actions { margin-top: 16px; display: flex; gap: 8px; }
    .st { font-style: normal; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #eee; }
    .st.active { background: #d4f7dc; } .st.pending { background: #fff3c4; } .st.rejected { background: #ffd6d6; }
    .err { color: var(--danger); font-size: 14px; }
    .warn { color: #b77900; }
    .chat { background: var(--card); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; height: 70vh; }
    #msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
    .msg { align-self: flex-start; background: #eee; padding: 8px 12px; border-radius: 12px; max-width: 75%; white-space: pre-wrap; }
    .msg.me { align-self: flex-end; background: var(--main); color: #fff; }
    .chat form { display: flex; gap: 8px; }
    .chat form input { flex: 1; }
    @media (max-width: 600px) { .row { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#/">Bozor</a>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <script src="app.js"></script>
</body>
</html>
