<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eef8">
  <title>Bozor</title>
  <style>
    :root {
      --tint: #0a84ff;
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.65);
      --text: #1c1c1e;
      --muted: #6e6e73;
      --danger: #ff3b30;
      --warn: #ff9f0a;
      --bg: #e9eef8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --glass: rgba(44, 44, 50, 0.55);
        --glass-strong: rgba(60, 60, 68, 0.75);
        --glass-border: rgba(255, 255, 255, 0.12);
        --text: #f5f5f7;
        --muted: #98989d;
        --bg: #000;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Liquid background blobs */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      z-index: -1;
      pointer-events: none;
    }
    body::before { background: #7dd3fc; top: -18vmax; left: -12vmax; }
    body::after { background: #f0abfc; bottom: -18vmax; right: -12vmax; }
    @media (prefers-color-scheme: dark) {
      body::before { background: #1e3a8a; }
      body::after { background: #581c87; }
    }

    /* Floating glass header */
    header {
      position: sticky;
      top: 10px;
      z-index: 10;
      margin: 10px auto 0;
      width: min(960px, calc(100% - 24px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .logo {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.3px;
      color: var(--tint);
      text-decoration: none;
      padding-left: 8px;
    }
    nav { display: flex; flex-wrap: wrap; gap: 4px; }
    nav a {
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    nav a:hover { background: rgba(127, 127, 127, 0.15); }

    main { max-width: 960px; margin: 22px auto; padding: 0 12px; }
    h2 { font-size: 26px; letter-spacing: -0.4px; margin: 4px 0 14px; }
    h3 { font-size: 18px; letter-spacing: -0.2px; }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }

    /* Glass controls */
    input, select, textarea, button {
      font: inherit;
      font-size: 15px;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      color: var(--text);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.35); }
    textarea { width: 100%; min-height: 110px; resize: vertical; }
    button {
      background: linear-gradient(180deg, #3d9bff, #0a84ff);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    button.danger {
      background: linear-gradient(180deg, #ff6259, #ff3b30);
      box-shadow: 0 4px 14px rgba(255, 59, 48, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* Glass surfaces */
    .card, .row, .detail, .form, .chat {
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      padding: 16px;
      color: inherit;
      text-decoration: none;
      display: block;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .card { transition: transform 0.2s ease; }
    .card:hover { transform: translateY(-3px); }
    .card h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; line-height: 1.3; }
    .card small { display: block; margin-top: 10px; color: var(--muted); font-size: 12px; }

    /* iOS-style sticker: price tag */
    .price {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffd60a, #ff9f0a);
      color: #1c1c1e;
      font-weight: 700;
      font-size: 15px;
      border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(255, 159, 10, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transform: rotate(-2deg);
    }
    .detail .price { font-size: 22px; padding: 10px 16px; border-radius: 18px; }
    .detail .price small { font-size: 12px; font-weight: 600; opacity: 0.8; }

    /* iOS-style sticker: phone pill */
    .phone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 4px 6px 4px 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #34c759, #30b350);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.35);
    }
    .phone::before { content: "\260E"; }

    /* iOS-style sticker: status chips */
    .st {
      display: inline-block;
      font-style: normal;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(142, 142, 147, 0.2);
    }
    .st.active { background: rgba(52, 199, 89, 0.2); color: #248a3d; }
    .st.pending { background: rgba(255, 159, 10, 0.2); color: #b25000; }
    .st.rejected { background: rgba(255, 59, 48, 0.18); color: #c4281e; }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; padding: 14px 16px; }
    .row small { color: var(--muted); }
    .form { display: flex; flex-direction: column; gap: 12px; max-width: 480px; }
    .detail .desc { white-space: pre-wrap; line-height: 1.55; }
    .actions { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .acts button { padding: 7px 12px; font-size: 13px; border-radius: 999px; }

    .err { color: var(--danger); font-size: 14px; font-weight: 500; }
    .warn {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 159, 10, 0.18);
      color: var(--warn);
      font-weight: 600;
    }

    /* Chat bubbles */
    .chat { height: 72vh; display: flex; flex-direction: column; padding: 14px; }
    #msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 4px 10px; }
    .msg {
      align-self: flex-start;
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 20px 20px 20px 6px;
      background: rgba(127, 127, 127, 0.18);
      white-space: pre-wrap;
      font-size: 15px;
    }
    .msg.me {
      align-self: flex-end;
      border-radius: 20px 20px 6px 20px;
      background: linear-gradient(180deg, #3d9bff, #0a84ff);
      color: #fff;
    }
    .chat form { display: flex; gap: 8px; }
    .chat form input { flex: 1; }

    @media (max-width: 600px) {
      header { border-radius: 24px; }
      .row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#/">Bozor</a>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
