<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eef8">
  <title>Bozor</title>
  <style>
    :root {
      --tint: #0a84ff;
      --tint-2: #5e5ce6;
      --glass: rgba(255, 255, 255, 0.5);
      --glass-strong: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.7);
      --text: #1c1c1e;
      --muted: #6e6e73;
      --danger: #ff3b30;
      --ok: #34c759;
      --warn: #ff9f0a;
      --bg: #e9eef8;
      --shadow: 0 12px 40px rgba(20, 30, 60, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --glass: rgba(44, 44, 50, 0.5);
        --glass-strong: rgba(60, 60, 68, 0.78);
        --glass-border: rgba(255, 255, 255, 0.12);
        --text: #f5f5f7;
        --muted: #98989d;
        --bg: #000;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.55;
      z-index: -1;
      pointer-events: none;
    }
    body::before { background: #7dd3fc; top: -20vmax; left: -15vmax; }
    body::after { background: #f0abfc; bottom: -20vmax; right: -15vmax; }
    @media (prefers-color-scheme: dark) {
      body::before { background: #1e3a8a; }
      body::after { background: #4c1d95; }
    }

    /* Suzib yuruvchi shisha header */
    header {
      position: sticky;
      top: 10px;
      z-index: 10;
      margin: 10px auto 0;
      width: min(1040px, calc(100% - 24px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px 8px 18px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .logo {
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--tint), var(--tint-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
    nav a {
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    nav a:hover { background: rgba(127, 127, 127, 0.14); }
    nav a.on { background: var(--tint); color: #fff; }
    nav .langs { display: flex; gap: 2px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--glass-border); }
    nav .langs a { padding: 6px 9px; font-size: 12px; font-weight: 700; }

    main { max-width: 1040px; margin: 24px auto 40px; padding: 0 14px; }
    h1 { font-size: 30px; letter-spacing: -0.6px; margin: 0 0 6px; }
    h2 { font-size: 24px; letter-spacing: -0.4px; margin: 0 0 10px; }
    h3 { font-size: 17px; letter-spacing: -0.2px; }
    .muted { color: var(--muted); }

    .hero {
      padding: 26px 24px;
      margin-bottom: 18px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.85), rgba(94, 92, 230, 0.85));
      color: #fff;
      box-shadow: 0 16px 40px rgba(10, 132, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .hero p { margin: 0; opacity: 0.9; }

    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .bar input { flex: 1; min-width: 160px; }

    /* Boshqaruv elementlari */
    input, select, textarea, button {
      font: inherit;
      font-size: 15px;
      padding: 12px 15px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      color: var(--text);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      outline: none;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.25); }
    textarea { width: 100%; min-height: 110px; resize: vertical; }
    button {
      background: linear-gradient(180deg, #3d9bff, #0a84ff);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.55; cursor: default; }
    button.danger {
      background: linear-gradient(180deg, #ff6259, #ff3b30);
      box-shadow: 0 6px 18px rgba(255, 59, 48, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    button.ghost {
      background: var(--glass-strong);
      color: var(--tint);
      box-shadow: none;
    }

    /* Shisha yuzalar */
    .glass, .card, .row, .detail, .form, .chat, .auth-card {
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      padding: 16px;
    }

    /* Mahsulot kartalari */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { display: flex; flex-direction: column; gap: 10px; padding: 12px; color: inherit; text-decoration: none; transition: transform 0.25s ease; }
    .card:hover { transform: translateY(-4px); }
    .thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 18px;
      background: rgba(127, 127, 127, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }
    .card h3 { margin: 2px 4px 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
    .card .meta { margin: 0 4px; color: var(--muted); font-size: 12px; }

    /* iOS uslubidagi stikerlar */
    .price {
      display: inline-block;
      align-self: flex-start;
      margin-left: 4px;
      padding: 6px 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffd60a, #ff9f0a);
      color: #1c1c1e;
      font-weight: 700;
      font-size: 15px;
      border: 2px solid #fff;
      box-shadow: 0 5px 14px rgba(255, 159, 10, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transform: rotate(-2deg);
    }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(127, 127, 127, 0.16);
    }
    .tag.new { background: rgba(52, 199, 89, 0.2); color: #248a3d; }
    .st {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      font-style: normal;
      background: rgba(142, 142, 147, 0.2);
    }
    .st.active { background: rgba(52, 199, 89, 0.2); color: #248a3d; }
    .st.pending { background: rgba(255, 159, 10, 0.2); color: #b25000; }
    .st.rejected { background: rgba(255, 59, 48, 0.18); color: #c4281e; }
    .phone {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 4px 6px 4px 0;
      padding: 9px 15px;
      border-radius: 999px;
      background: linear-gradient(135deg, #34c759, #30b350);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 5px 14px rgba(52, 199, 89, 0.35);
    }
    .phone::before { content: "\260E"; }

    /* Mahsulot sahifasi */
    .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; }
    .gallery img.main { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 22px; display: block; }
    .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .thumbs img { width: 62px; height: 62px; object-fit: cover; border-radius: 14px; cursor: pointer; opacity: 0.6; border: 2px solid transparent; }
    .thumbs img.on { opacity: 1; border-color: var(--tint); }
    .specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 14px 0; font-size: 14px; }
    .specs dt { color: var(--muted); }
    .specs dd { margin: 0; font-weight: 500; }
    .desc { white-space: pre-wrap; line-height: 1.55; }
    .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .acts button { padding: 7px 12px; font-size: 13px; border-radius: 999px; }
    .warn { display: inline-block; padding: 6px 12px; border-radius: 999px; background: rgba(255, 159, 10, 0.18); color: #b25000; font-weight: 600; font-size: 14px; }

    /* Ro‘yxat qatorlari */
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; padding: 12px 14px; }
    .row .info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .row .mini { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; flex-shrink: 0; }
    .row .mini.noimg { font-size: 22px; display: flex; align-items: center; justify-content: center; background: rgba(127, 127, 127, 0.12); }
    .row small { color: var(--muted); }
    a.row { color: inherit; text-decoration: none; }

    /* Auth sahifalari */
    .auth { min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 100%; max-width: 420px; padding: 28px; }
    .auth-card h2 { text-align: center; }
    .auth-card .muted { text-align: center; margin: 0 0 18px; }
    .auth-links { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; font-size: 14px; flex-wrap: wrap; }
    .auth-links a { color: var(--tint); text-decoration: none; font-weight: 500; }
    .otp {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 12px;
      padding: 14px;
    }

    /* Forma */
    .form { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
    .form.wide { max-width: 760px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fields .full { grid-column: 1 / -1; }
    .lbl { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }
    .imgs { display: flex; gap: 10px; flex-wrap: wrap; }
    .imgs .pic { position: relative; width: 96px; height: 96px; }
    .imgs .pic img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
    .imgs .pic button {
      position: absolute; top: 4px; right: 4px; padding: 3px 7px; font-size: 11px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.55); box-shadow: none;
    }
    .err { color: var(--danger); font-size: 14px; font-weight: 500; margin: 0; }
    .notice { color: var(--ok); font-size: 14px; font-weight: 600; text-align: center; margin: 0 0 10px; }

    /* Chat */
    .chat { height: 72vh; display: flex; flex-direction: column; }
    #msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 4px 10px; }
    .msg {
      align-self: flex-start;
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 20px 20px 20px 6px;
      background: rgba(127, 127, 127, 0.18);
      white-space: pre-wrap;
      font-size: 15px;
    }
    .msg.me {
      align-self: flex-end;
      border-radius: 20px 20px 6px 20px;
      background: linear-gradient(180deg, #3d9bff, #0a84ff);
      color: #fff;
    }
    .chat form { display: flex; gap: 8px; }
    .chat form input { flex: 1; }

    .empty { text-align: center; padding: 40px 10px; color: var(--muted); }

    @media (max-width: 720px) {
      header { border-radius: 26px; }
      .detail { grid-template-columns: 1fr; }
      .fields { grid-template-columns: 1fr; }
      .row { flex-direction: column; align-items: flex-start; }
      .hero { padding: 20px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="#/">Bozor</a>
    <nav id="nav"></nav>
  </header>
  <main id="app"></main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
